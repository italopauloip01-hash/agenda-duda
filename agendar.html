<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agende seu horário</title>
<meta name="description" content="Escolha o serviço, o dia e o horário e agende online em menos de um minuto.">
<meta property="og:title" content="Agende seu horário">
<meta property="og:description" content="Esmalteria e podologia — agende online em menos de um minuto.">
<meta name="theme-color" content="#FFF8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1216" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* ── Paleta rosê ─────────────────────────────────────────────── */
:root{
  --bg:#FFF8F6; --bg-2:#FCEFF0; --card:#FFFFFF; --ink:#3B2930; --muted:#8A7178; --soft:#B9A3A9;
  --line:#F1E2E5; --rose:#C9718A; --rose-2:#A44E68; --rose-lt:#F8E4E9; --blush:#F6D9DF; --gold:#C9A15A;
  --ok:#4E8A68; --danger:#B4423F; --on:#FFFFFF;
  --sombra:0 10px 30px -12px rgba(164,78,104,.28); --sombra-sm:0 4px 14px -6px rgba(164,78,104,.22);
  --r:22px; --r-sm:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1216; --bg-2:#22171C; --card:#261A20; --ink:#F7E9ED; --muted:#C4A9B1; --soft:#7E6870;
  --line:#3A2830; --rose:#E59AAE; --rose-2:#F0B3C3; --rose-lt:#3A2229; --blush:#4A2C35; --gold:#D9B26B;
  --ok:#8CC9A5; --danger:#F09A93; --on:#2A1A20;
  --sombra:0 10px 30px -12px rgba(0,0,0,.6); --sombra-sm:0 4px 14px -6px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1216;--bg-2:#22171C;--card:#261A20;--ink:#F7E9ED;--muted:#C4A9B1;--soft:#7E6870;
  --line:#3A2830;--rose:#E59AAE;--rose-2:#F0B3C3;--rose-lt:#3A2229;--blush:#4A2C35;--gold:#D9B26B;--ok:#8CC9A5;--danger:#F09A93;--on:#2A1A20;
  --sombra:0 10px 30px -12px rgba(0,0,0,.6);--sombra-sm:0 4px 14px -6px rgba(0,0,0,.5);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:8px}
.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(120px + env(safe-area-inset-bottom,0px));overflow-x:clip}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── Animações ───────────────────────────────────────────────── */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}
@keyframes aproxima{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes flutua{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12px,-14px) scale(1.06)}}
@keyframes surge{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(201,113,138,.45)}70%{box-shadow:0 0 0 12px rgba(201,113,138,0)}}
@keyframes traco{to{stroke-dashoffset:0}}
@keyframes petala{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:0}}
.surge{animation:surge .45s cubic-bezier(.2,.7,.2,1) both}

/* ── Capa ────────────────────────────────────────────────────── */
.capa{position:relative;margin:0 -20px;height:min(62vh,460px);overflow:hidden;border-radius:0 0 34px 34px;background:linear-gradient(150deg,var(--blush),var(--rose-lt) 55%,var(--bg-2))}
.capa .img{position:absolute;inset:0;background:center 30%/cover no-repeat;animation:aproxima 9s ease-out both}
.capa::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(26,18,22,.05) 30%,rgba(26,18,22,.62))}
.capa.sem-foto::after{display:none}
.capa .bolha{position:absolute;border-radius:50%;filter:blur(28px);opacity:.75;animation:flutua 9s ease-in-out infinite}
.capa .b1{width:220px;height:220px;background:var(--rose);top:-40px;right:-50px;opacity:.35}
.capa .b2{width:180px;height:180px;background:var(--gold);bottom:40px;left:-60px;opacity:.22;animation-delay:-3s}
.capa .b3{width:140px;height:140px;background:var(--rose-2);bottom:-30px;right:30%;opacity:.25;animation-delay:-6s}
.capa-txt{position:absolute;left:24px;right:24px;bottom:30px;color:#fff;z-index:1}
.capa.sem-foto .capa-txt{color:var(--ink)}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:12px}
.capa.sem-foto .selo{background:var(--card);box-shadow:var(--sombra-sm)}
.selo i{width:7px;height:7px;border-radius:50%;background:#7BD39A;animation:pulsa 2.2s infinite}
.capa h1{font-size:clamp(34px,9vw,44px);line-height:1.02}
.capa h1 em{font-style:italic;color:var(--blush)}
.capa.sem-foto h1 em{color:var(--rose-2)}
.capa p{margin-top:10px;font-size:15.5px;line-height:1.5;opacity:.92;max-width:420px;white-space:pre-line}

.acoes{display:flex;gap:10px;margin:22px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 20px;border-radius:999px;border:1.5px solid transparent;font-size:16px;font-weight:600;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;width:100%;line-height:1.1;white-space:nowrap}
@media (max-width:380px){.acoes .btn{font-size:15px;padding:14px 14px}}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-rosa{background:linear-gradient(135deg,var(--rose),var(--rose-2));color:#fff;box-shadow:var(--sombra)}
.btn-linha{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-zap{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-zap svg{color:#25D366}
.acoes .btn{flex:1}

/* ── Seções ──────────────────────────────────────────────────── */
section{margin-top:46px}
.sec-tit{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-tit h2{font-size:28px;line-height:1.1}
.sec-tit h2 em{font-style:italic;color:var(--rose-2)}
.sec-tit small{color:var(--muted);font-size:13.5px;white-space:nowrap}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:600;margin-bottom:6px}

/* Book */
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 14px;padding:2px 20px}
.pills::-webkit-scrollbar{display:none}
.pill{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;transition:all .2s}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.book button{aspect-ratio:1;border:none;padding:0;border-radius:14px;background:var(--bg-2) center/cover no-repeat;transition:transform .3s,box-shadow .3s;animation:surge .5s both}
.book button:hover{transform:scale(1.02);box-shadow:var(--sombra-sm)}
.book button:first-child{grid-column:span 2;grid-row:span 2;border-radius:20px}
.mais{text-align:center;margin-top:14px}
.link{background:none;border:none;color:var(--rose-2);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:4px}

/* Carrossel de avaliações */
.nota-geral{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.nota-geral b{font-family:'Fraunces',serif;font-weight:500;font-size:40px;line-height:1}
.estrelas{color:var(--gold);letter-spacing:2px;font-size:15px}
.nota-geral small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.carrossel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:4px 20px 18px;scroll-padding:0 20px}
.carrossel::-webkit-scrollbar{display:none}
.depo{flex:0 0 86%;scroll-snap-align:start;background:var(--card);border-radius:var(--r);padding:24px 22px 20px;box-shadow:var(--sombra-sm);position:relative;border:1px solid var(--line)}
.depo::before{content:'“';position:absolute;top:-6px;right:18px;font-family:'Fraunces',serif;font-size:90px;line-height:1;color:var(--blush)}
.depo p{font-family:'Fraunces',serif;font-size:19px;line-height:1.45;margin:12px 0 16px;position:relative}
.depo .quem{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.depo .ini{width:34px;height:34px;border-radius:50%;background:var(--rose-lt);color:var(--rose-2);display:flex;align-items:center;justify-content:center;font-weight:600}
.pontos{display:flex;justify-content:center;gap:7px}
.pontos button{width:8px;height:8px;border-radius:999px;border:none;background:var(--line);transition:all .3s;padding:0}
.pontos button.on{width:24px;background:var(--rose)}

/* ── Agendamento ─────────────────────────────────────────────── */
.agendar{background:var(--card);border-radius:28px;padding:22px 18px;box-shadow:var(--sombra);border:1px solid var(--line)}
.passos{display:flex;gap:6px;margin-bottom:22px}
.passos div{flex:1;text-align:center;font-size:11.5px;color:var(--soft);font-weight:500}
.passos div::before{content:'';display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:7px;transition:background .4s}
.passos div.on{color:var(--rose-2)}
.passos div.on::before,.passos div.ok::before{background:linear-gradient(90deg,var(--rose),var(--rose-2))}
.passos div.ok{color:var(--muted)}
.etapa-tit{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.etapa-tit h3{font-family:'Fraunces',serif;font-weight:400;font-size:23px}
.resumo-linha{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r-sm);background:var(--bg-2);margin-bottom:8px;animation:surge .35s both}
.resumo-linha .rot{font-size:12px;color:var(--muted)}
.resumo-linha .val{font-weight:600;font-size:15px}
.resumo-linha .link{margin-left:auto;font-size:13.5px}
.resumo-linha .ic{width:36px;height:36px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--rose-2);flex-shrink:0}

.abas{display:flex;background:var(--bg-2);border-radius:999px;padding:4px;margin-bottom:14px}
.abas button{flex:1;border:none;background:none;padding:10px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted);transition:all .25s}
.abas button.on{background:var(--card);color:var(--rose-2);box-shadow:var(--sombra-sm)}
.svcs{display:flex;flex-direction:column;gap:10px}
.svc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px 16px;transition:all .2s;animation:surge .4s both}
.svc:hover{border-color:var(--blush)}
.svc.on{border-color:var(--rose);background:var(--rose-lt)}
.svc .ic{width:44px;height:44px;border-radius:14px;background:var(--rose-lt);color:var(--rose-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.svc.on .ic{background:var(--rose);color:#fff}
.svc .n{flex:1;min-width:0}
.svc .n b{display:block;font-weight:600;font-size:15.5px}
.svc .n span{font-size:13.5px;color:var(--muted)}
.svc .p{font-weight:600;font-size:15.5px;white-space:nowrap}

.mes{font-family:'Fraunces',serif;font-size:17px;margin-bottom:10px;text-transform:capitalize;color:var(--muted)}
.dias{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:4px 18px 8px;scroll-padding:0 18px}
.dias::-webkit-scrollbar{display:none}
.dia{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;padding:11px 0 10px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);transition:all .2s}
.dia small{font-size:12px;color:var(--muted);font-weight:500}
.dia b{font-size:21px;font-weight:600}
.dia em{font-style:normal;font-size:10.5px;color:var(--soft);height:12px}
.dia.on{background:linear-gradient(160deg,var(--rose),var(--rose-2));border-color:transparent;box-shadow:var(--sombra-sm);transform:translateY(-2px)}
.dia.on small,.dia.on b,.dia.on em{color:#fff}
.dia:disabled{opacity:.38}
.turno{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.turno:first-child{margin-top:4px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:13px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;transition:all .18s;animation:surge .35s both}
.slot:hover{border-color:var(--rose)}
.slot.on{background:var(--ink);border-color:var(--ink);color:var(--bg);transform:scale(1.04)}
.vazio{text-align:center;color:var(--muted);font-size:15px;padding:20px 8px;line-height:1.5}
.campo{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.campo label{font-size:13.5px;font-weight:500;color:var(--muted)}
.campo input,.campo textarea{padding:15px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
.campo input:focus,.campo textarea:focus{border-color:var(--rose);box-shadow:0 0 0 4px var(--rose-lt)}
.lembrar{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted);margin:4px 0 6px}
.lembrar input{width:20px;height:20px;accent-color:var(--rose)}
.erro{color:var(--danger);font-size:14.5px;margin-top:8px;line-height:1.45;animation:surge .3s both}

/* Barra fixa */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px max(12px,env(safe-area-inset-bottom,0px));transform:translateY(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.barra.vis{transform:none}
.barra-in{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 20px;box-shadow:var(--sombra)}
.barra-txt{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.3}
.barra-txt b{display:block;color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .btn{width:auto;padding:13px 22px;font-size:15px}

/* Rodapé */
.rodape{margin-top:46px;text-align:center}
.horas{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:6px 18px;text-align:left}
.horas div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.horas div:last-child{border-bottom:none}
.horas div.hoje{color:var(--rose-2);font-weight:600}
.horas span{color:var(--muted)}
.horas div.hoje span{color:var(--rose-2)}
.assina{margin-top:26px;font-size:12.5px;color:var(--soft)}

/* Sucesso */
.sucesso{text-align:center;padding:64px 0 10px;position:relative}
.sucesso-ic{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-2));color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;box-shadow:var(--sombra);animation:surge .5s both}
.sucesso-ic svg{width:40px;height:40px;stroke-width:2.4}
.sucesso-ic path{stroke-dasharray:30;stroke-dashoffset:30;animation:traco .6s .35s ease forwards}
.sucesso h1{font-size:36px;line-height:1.05}
.sucesso h1 em{font-style:italic;color:var(--rose-2)}
.sucesso p{color:var(--muted);margin-top:10px;line-height:1.5}
.cartao{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:6px 18px;margin:26px 0 16px;box-shadow:var(--sombra-sm)}
.cartao div{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.cartao div:last-child{border-bottom:none}
.cartao span{color:var(--muted)}
.col{display:flex;flex-direction:column;gap:10px}
.petala{position:fixed;top:0;width:12px;height:16px;border-radius:12px 0 12px 0;background:var(--rose);opacity:0;pointer-events:none;z-index:30;animation:petala 3.6s ease-in forwards}

/* Foto ampliada */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(20,12,16,.94);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;animation:surge .25s both}
.lightbox img{max-width:100%;max-height:78vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox p{color:#F3E6EA;font-size:15px;text-align:center}
.lb-btn{position:absolute;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.lb-fechar{top:max(16px,env(safe-area-inset-top,0px));right:16px}
.lb-ant{left:12px;top:50%;margin-top:-23px}.lb-prox{right:12px;top:50%;margin-top:-23px}

.carregando{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:80vh;color:var(--muted);text-align:center}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--rose);animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="carregando"><div class="spin"></div>Preparando a agenda…</div></div>
<div class="barra" id="barra"><div class="barra-in"><div class="barra-txt" id="barraTxt"></div><button class="btn btn-rosa" id="barraBtn"></button></div></div>
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-btn lb-fechar" onclick="fecharFoto()" aria-label="Fechar">×</button>
  <button class="lb-btn lb-ant" onclick="passarFoto(-1)" aria-label="Foto anterior">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-btn lb-prox" onclick="passarFoto(1)" aria-label="Próxima foto">›</button>
  <p id="lbTxt"></p>
</div>

<script>
// Página pública: lê tudo por funções seguras do banco (agenda_publica,
// horarios_ocupados, agendar_online) — nunca enxerga dados de outras clientes.
const SUPABASE_URL='https://rsrpfwtrkpclscpccaok.supabase.co';
const SUPABASE_KEY='sb_publishable_0FRlkE_cdq_RKIpX6pSjGA_boyTYEX0';
const SLUG=(new URLSearchParams(location.search).get('u')||'').toLowerCase();
const CATS={gel:'Unhas em gel',acrilico:'Acrílico',esmaltacao:'Esmaltação',nailart:'Nail art',podologia:'Podologia',tratamentos:'Tratamentos'};
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_LONGOS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

const IC={

let A=null, escolha={tipo:null,svc:null,dia:null,hora:null}, filtroFoto='todos', verTodas=false, fotosVisiveis=[], fotoAtual=0;
const ocupadosCache={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
const hhmm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const reais=v=>'R$ '+Number(v).toFixed(2).replace('.',',').replace(',00','');
const foto=c=>`${SUPABASE_URL}/storage/v1/object/public/portfolio/${c.split('/').map(encodeURIComponent).join('/')}`;
const telLink=(t,msg)=>t?`https://wa.me/${String(t).replace(/\D/g,'')}${msg?'?text='+encodeURIComponent(msg):''}`:null;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

async function rpc(fn,args){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e=new Error(j?.message||'erro');e.codigo=j?.message;throw e}
  return j;
}

async function iniciar(){
  if(!SLUG){indisponivel();return}
  try{A=await rpc('agenda_publica',{p_slug:SLUG})}catch(e){A=null}
  if(!A){indisponivel();return}
  document.title=`${A.nome} · Agende seu horário`;
  const tipos=[...new Set(A.servicos.map(s=>s.tipo))];
  escolha.tipo=tipos.includes('esmalteria')?'esmalteria':tipos[0];
  renderPagina();
}

// Aparece suavemente ao rolar
let obs;
function observarRevelacao(){
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in'));return}
  obs=obs||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -30px'});
  document.querySelectorAll('.reveal:not(.in)').forEach(e=>obs.observe(e));
}

function filtrar(c){filtroFoto=c;verTodas=false;renderBook()}
function abrirFoto(i){fotoAtual=i;mostrarFoto();document.getElementById('lightbox').hidden=false;document.body.style.overflow='hidden'}
function mostrarFoto(){const f=fotosVisiveis[fotoAtual];document.getElementById('lbImg').src=foto(f.caminho);document.getElementById('lbTxt').textContent=f.legenda||CATS[f.categoria]||''}
function passarFoto(d){fotoAtual=(fotoAtual+d+fotosVisiveis.length)%fotosVisiveis.length;mostrarFoto()}
function fecharFoto(){document.getElementById('lightbox').hidden=true;document.body.style.overflow=''}
(()=>{let x0=null;const lb=document.getElementById('lightbox');
  lb.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
  lb.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)passarFoto(dx<0?1:-1);x0=null});
  lb.addEventListener('click',e=>{if(e.target===lb)fecharFoto()});
  document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')fecharFoto();if(e.key==='ArrowRight')passarFoto(1);if(e.key==='ArrowLeft')passarFoto(-1)});
})();

// ── Carrossel de avaliações (passa sozinho, pausa ao tocar) ─────
let carTimer, carPausa=0;
function iniciarCarrossel(){
  const c=document.getElementById('carrossel');if(!c)return;
  const pts=[...document.querySelectorAll('#pontos button')];
  const atual=()=>Math.round(c.scrollLeft/(c.children[0].offsetWidth+12));
  const marcar=()=>{const i=atual();pts.forEach((p,j)=>p.classList.toggle('on',i===j))};
  c.addEventListener('scroll',()=>{clearTimeout(c._t);c._t=setTimeout(marcar,60)},{passive:true});
  ['pointerdown','touchstart'].forEach(ev=>c.addEventListener(ev,()=>carPausa=Date.now()+8000,{passive:true}));
  marcar();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||pts.length<2)return;
  clearInterval(carTimer);
  carTimer=setInterval(()=>{if(Date.now()<carPausa||document.hidden)return;const i=atual();irPara(i+1>=pts.length?0:i+1,true)},5000);
}
function irPara(i,auto){
  const c=document.getElementById('carrossel');if(!auto)carPausa=Date.now()+8000;
  c.scrollTo({left:i*(c.children[0].offsetWidth+12),behavior:'smooth'});
}

// ── Dias e horários livres (o banco confere de novo ao agendar) ─
function horarioDia(d){return A.horarios.find(h=>h.dia===d.getDay())}
function diasDisponiveis(){
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const out=[];
  for(let i=0;i<=A.dias_frente;i++){const d=new Date(hoje);d.setDate(d.getDate()+i);out.push(d)}
  return out;
}
async function slotsDoDia(d){
  const h=horarioDia(d);if(!h||!h.abre)return [];
  const k=ymd(d);
  if(!ocupadosCache[k]) ocupadosCache[k]=(await rpc('horarios_ocupados',{p_slug:SLUG,p_dia:k})).map(([i,f])=>[new Date(i),new Date(f)]);
  const ocup=ocupadosCache[k];
  const dur=escolha.svc.duracao_min+escolha.svc.intervalo_min;
  const minimo=Date.now()+A.antecedencia_min*6e4, limite=Date.now()+A.dias_frente*864e5;
  const out=[];
  for(let m=toMin(h.abre);m+dur<=toMin(h.fecha);m+=30){
    if(h.almoco_inicio&&m<toMin(h.almoco_fim)&&m+dur>toMin(h.almoco_inicio)) continue;
    const ini=new Date(`${k}T${hhmm(m)}:00-03:00`), fim=new Date(ini.getTime()+dur*6e4);
    if(ini.getTime()<minimo||ini.getTime()>limite) continue;
    if(ocup.some(([oi,of])=>ini<of&&fim>oi)) continue;
    out.push(hhmm(m));
  }
  return out;
}
const rotuloDia=d=>{const h=new Date();h.setHours(0,0,0,0);const n=Math.round((d-h)/864e5);return n===0?'Hoje':n===1?'Amanhã':DIAS[d.getDay()]};
const dataLonga=d=>`${rotuloDia(d)==='Hoje'||rotuloDia(d)==='Amanhã'?rotuloDia(d)+', ':DIAS_LONGOS[d.getDay()]+', '}${d.getDate()} de ${MESES[d.getMonth()]}`;

// ── Agendamento em etapas ──────────────────────────────────────
function etapaAtual(){return !escolha.svc?1:!escolha.dia?2:!escolha.hora?3:4}
function renderAgendamento(){
  const el=document.getElementById('agendamento');
  const e=etapaAtual();
  const nomes=['Serviço','Dia','Horário','Seus dados'];
  const resumo=[];
  if(escolha.svc) resumo.push(linhaResumo(escolha.svc.tipo==='podologia'?IC.pe:IC.unha,'Serviço',`${esc(escolha.svc.nome)} · ${reais(escolha.svc.preco)}`,'voltarPara(1)'));
  if(escolha.dia) resumo.push(linhaResumo(IC.cal,'Dia',dataLonga(escolha.dia),'voltarPara(2)'));
  if(escolha.hora) resumo.push(linhaResumo(IC.rel,'Horário',escolha.hora,'voltarPara(3)'));
  el.innerHTML=`<div class="passos">${nomes.map((n,i)=>`<div class="${i+1===e?'on':i+1<e?'ok':''}">${n}</div>`).join('')}</div>
    ${resumo.join('')}
    <div id="etapa" class="surge" style="margin-top:${resumo.length?16:0}px"></div>`;
  [renderServicos,renderDias,renderHoras,renderDados][e-1]();
  atualizarBarra();
}
function linhaResumo(ic,rot,val,acao){
  return `<div class="resumo-linha"><span class="ic">${ic}</span><div><div class="rot">${rot}</div><div class="val">${val}</div></div><button class="link" onclick="${acao}">alterar</button></div>`;
}
function voltarPara(n){
  if(n<=1){escolha.svc=null;escolha.hora=null}
  if(n<=2){escolha.dia=null;escolha.hora=null}
  if(n<=3) escolha.hora=null;
  renderAgendamento();rolarPara();
}
function rolarPara(){const el=document.getElementById('agendamento');const y=el.getBoundingClientRect().top+scrollY-16;if(Math.abs(y-scrollY)>40)scrollTo({top:y,behavior:'smooth'})}

function renderServicos(){
  const tipos=[...new Set(A.servicos.map(s=>s.tipo))];
  const lista=A.servicos.filter(s=>s.tipo===escolha.tipo);
  document.getElementById('etapa').innerHTML=`
    <div class="etapa-tit"><h3>Qual serviço?</h3></div>
    ${tipos.length>1?`<div class="abas">${tipos.map(t=>`<button class="${escolha.tipo===t?'on':''}" onclick="escolha.tipo='${t}';renderServicos()">${t==='podologia'?'Pés & podologia':'Unhas'}</button>`).join('')}</div>`:''}
    <div class="svcs">${lista.map((s,i)=>`
      <button class="svc" style="animation-delay:${i*40}ms" onclick="escolherSvc('${s.id}')">
        <span class="ic">${s.tipo==='podologia'?IC.pe:IC.unha}</span>
        <span class="n"><b>${esc(s.nome)}</b><span>${s.duracao_min} min</span></span>
        <span class="p">${reais(s.preco)}</span>
      </button>`).join('')}</div>`;
}
function escolherSvc(id){escolha.svc=A.servicos.find(s=>s.id===id);escolha.hora=null;renderAgendamento();rolarPara()}

function renderDias(){
  const dias=diasDisponiveis();
  const abertos=dias.filter(d=>horarioDia(d)?.abre);
  document.getElementById('etapa').innerHTML=`
    <div class="etapa-tit"><h3>Qual dia?</h3><small style="color:var(--muted)">próximos ${A.dias_frente} dias</small></div>
    <div class="mes" id="mesTxt">${MESES[(abertos[0]||dias[0]).getMonth()]}</div>
    <div class="dias" id="dias">${dias.map(d=>{const fechado=!horarioDia(d)?.abre;return `<button class="dia" data-mes="${d.getMonth()}" ${fechado?'disabled':''} onclick="escolherDia('${ymd(d)}')"><small>${rotuloDia(d)}</small><b>${d.getDate()}</b><em>${fechado?'fechado':''}</em></button>`}).join('')}</div>`;
  const box=document.getElementById('dias');
  box.addEventListener('scroll',()=>{const b=[...box.children].find(x=>x.offsetLeft+x.offsetWidth>box.scrollLeft+30);if(b)document.getElementById('mesTxt').textContent=MESES[+b.dataset.mes]},{passive:true});
}
function escolherDia(k){escolha.dia=new Date(k+'T12:00:00');escolha.hora=null;renderAgendamento();rolarPara()}

async function renderHoras(){
  const et=document.getElementById('etapa');
  et.innerHTML=`<div class="etapa-tit"><h3>Que horas?</h3></div><div id="horas"><div class="vazio"><div class="spin" style="margin:0 auto 10px;width:26px;height:26px"></div>Buscando horários livres…</div></div>`;
  let s=[];
  try{s=await slotsDoDia(escolha.dia)}catch(e){}
  const box=document.getElementById('horas');if(!box)return;
  if(!s.length){box.innerHTML=`<div class="vazio">Esse dia já está cheio 😔<br><button class="link" style="margin-top:10px" onclick="voltarPara(2)">Escolher outro dia</button></div>`;return}
  const turnos=[['Manhã',0,720,'☀︎'],['Tarde',720,1080,'◐'],['Noite',1080,1440,'☾']];
  let i=0;
  box.innerHTML=turnos.map(([n,a,b,ic])=>{const l=s.filter(h=>toMin(h)>=a&&toMin(h)<b);return l.length?`<div class="turno">${ic} ${n}</div><div class="slots">${l.map(h=>`<button class="slot" style="animation-delay:${(i++)*25}ms" onclick="escolherHora('${h}')">${h}</button>`).join('')}</div>`:''}).join('');
}
function escolherHora(h){escolha.hora=h;renderAgendamento();rolarPara()}

function renderDados(){
  const salvo=store.get('agenda_cliente')||{};
  document.getElementById('etapa').innerHTML=`
    <div class="etapa-tit"><h3>Seus dados</h3></div>
    <div class="campo"><label for="nome">Seu nome</label><input id="nome" autocomplete="name" placeholder="Como podemos te chamar?" maxlength="80" value="${esc(salvo.nome||'')}"></div>
    <div class="campo"><label for="tel">WhatsApp</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" value="${esc(salvo.tel||'')}" oninput="mascara(this)"></div>
    <div class="campo"><label for="obs">Alguma observação? <span style="color:var(--soft)">(opcional)</span></label><textarea id="obs" rows="2" maxlength="300" placeholder="Preferência de cor, alergia, primeira vez…"></textarea></div>
    <label class="lembrar"><input type="checkbox" id="lembrar" ${salvo.nome?'checked':''}> Lembrar meus dados neste celular</label>
    <div class="erro" id="erro" hidden></div>`;
  if(!salvo.nome) setTimeout(()=>document.getElementById('nome')?.focus({preventScroll:true}),450);
}
function mascara(i){
  let d=i.value.replace(/\D/g,'').slice(0,11);
  i.value=d.length>6?`(${d.slice(0,2)}) ${d.slice(2,d.length-4)}-${d.slice(-4)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d;
}

function atualizarBarra(){
  const b=document.getElementById('barra'), t=document.getElementById('barraTxt'), btn=document.getElementById('barraBtn');
  b.classList.add('vis');
  const e=etapaAtual();
  btn.disabled=false;
  if(e===1){t.innerHTML='<b>Agende online</b>em menos de 1 minuto';btn.textContent='Começar';btn.onclick=()=>document.getElementById('agendar').scrollIntoView({behavior:'smooth'});return}
  const d=escolha.dia?`${rotuloDia(escolha.dia)} ${escolha.dia.getDate()}/${pad(escolha.dia.getMonth()+1)}`:'';
  t.innerHTML=`<b>${esc(escolha.svc.nome)}</b>${d}${escolha.hora?' às '+escolha.hora:''}${d?' · ':''}${reais(escolha.svc.preco)}`;
  if(e===2){btn.textContent='Escolher dia';btn.onclick=rolarPara}
  else if(e===3){btn.textContent='Escolher hora';btn.onclick=rolarPara}
  else{btn.textContent='Confirmar';btn.onclick=confirmar}
}

  nome_invalido:'Digite seu nome, por favor.',
  telefone_invalido:'Confira o número do WhatsApp com DDD.',
  limite:'Você já tem horários marcados por aqui. Fale com a gente pelo WhatsApp para marcar mais.',
  agenda_indisponivel:'A agenda online está fechada no momento.',
  servico_invalido:'Esse serviço não está mais disponível.',
};
async function confirmar(){
  const nome=document.getElementById('nome').value.trim(), tel=document.getElementById('tel').value, obs=document.getElementById('obs').value.trim();
  const erro=document.getElementById('erro');
  const mostrar=m=>{erro.textContent=m;erro.hidden=false;erro.scrollIntoView({behavior:'smooth',block:'center'})};
  if(nome.length<2){document.getElementById('nome').focus();return mostrar(ERROS.nome_invalido)}
  if(tel.replace(/\D/g,'').length<10){document.getElementById('tel').focus();return mostrar(ERROS.telefone_invalido)}
  if(document.getElementById('lembrar').checked) store.set('agenda_cliente',{nome,tel}); else store.del('agenda_cliente');
  const btn=document.getElementById('barraBtn');btn.disabled=true;btn.textContent='Agendando…';
  try{
    await rpc('agendar_online',{p_slug:SLUG,p_servico:escolha.svc.id,p_inicio:`${ymd(escolha.dia)}T${escolha.hora}:00-03:00`,p_nome:nome,p_telefone:tel,p_obs:obs||null});
    sucesso(nome);
  }catch(e){
    btn.disabled=false;atualizarBarra();
    if(e.codigo==='ocupado'){delete ocupadosCache[ymd(escolha.dia)];escolha.hora=null;renderAgendamento();rolarPara();setTimeout(()=>{const b=document.getElementById('horas');b&&b.insertAdjacentHTML('afterbegin',`<div class="erro" style="margin-bottom:10px">${ERROS.ocupado}</div>`)},400);return}
    mostrar(ERROS[e.codigo]||'Não deu certo agora. Tente de novo em instantes.');
  }
}
function petalas(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let i=0;i<18;i++){const p=document.createElement('span');p.className='petala';
    p.style.left=Math.random()*100+'vw';p.style.animationDelay=(Math.random()*1.2)+'s';p.style.animationDuration=(2.8+Math.random()*1.8)+'s';
    p.style.background=['var(--rose)','var(--blush)','var(--gold)','var(--rose-2)'][i%4];p.style.transform=`scale(${.6+Math.random()*.8})`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),5200)}
}
function sucesso(nome){
  document.getElementById('barra').classList.remove('vis');
  const ini=new Date(`${ymd(escolha.dia)}T${escolha.hora}:00-03:00`), fim=new Date(ini.getTime()+escolha.svc.duracao_min*6e4);
  const g=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const cal=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(escolha.svc.nome+' — '+A.nome)}&dates=${g(ini)}/${g(fim)}&details=${encodeURIComponent('Agendado pelo link')}`;
  const wa=telLink(A.whatsapp,`Oi! Acabei de agendar ${escolha.svc.nome} para ${dataLonga(escolha.dia).toLowerCase()} às ${escolha.hora}. Meu nome é ${nome} 😊`);
  document.getElementById('app').innerHTML=`
    <div class="sucesso">
      <div class="sucesso-ic"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1 class="serif surge" style="animation-delay:.15s">Horário <em>reservado!</em></h1>
      <p class="surge" style="animation-delay:.25s">Obrigada, ${esc(nome.split(' ')[0])}! A confirmação chega pelo seu WhatsApp. 💕</p>
    </div>
    <div class="cartao surge" style="animation-delay:.35s">
      <div><span>Serviço</span><b>${esc(escolha.svc.nome)}</b></div>
      <div><span>Dia</span><b>${dataLonga(escolha.dia)}</b></div>
      <div><span>Horário</span><b>${escolha.hora}</b></div>
      <div><span>Valor</span><b>${reais(escolha.svc.preco)}</b></div>
    </div>
    <div class="col surge" style="animation-delay:.45s">
      <a class="btn btn-rosa" href="${cal}" target="_blank" rel="noopener">${IC.cal}Salvar na minha agenda</a>
      ${wa?`<a class="btn btn-zap" href="${wa}" target="_blank" rel="noopener">${IC.zap}Avisar no WhatsApp</a>`:''}
      <button class="btn btn-linha" onclick="location.href=location.pathname+location.search">Agendar outro horário</button>
    </div>`;
  scrollTo({top:0,behavior:'smooth'});
  petalas();
}
iniciar();
</script>
</body>
</html>
