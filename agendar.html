<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agende seu horário</title>
<meta name="description" content="Escolha o serviço, o dia e o horário e agende online.">
<meta property="og:title" content="Agende seu horário">
<meta property="og:description" content="Esmalteria e podologia — escolha o dia e o horário e agende online.">
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0A09" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FAFAF9;--bg-card:#FFFFFF;--bg-subtle:#F5F5F4;--fg:#1C1917;--fg-muted:#78716C;--fg-soft:#A8A29E;
  --border:#E7E5E4;--border-strong:#D6D3D1;--accent:#A8556B;--accent-lt:#F7ECEF;--ok:#3D7F5A;--danger:#B42318;--on-fg:#FFFFFF;
  --r:16px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0A09;--bg-card:#161412;--bg-subtle:#1C1917;--fg:#F5F5F4;--fg-muted:#A8A29E;--fg-soft:#6B6560;
  --border:#292524;--border-strong:#3A3532;--accent:#D8A7B4;--accent-lt:#2A1C20;--ok:#7BC29A;--danger:#F08A7E;--on-fg:#0C0A09;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C0A09;--bg-card:#161412;--bg-subtle:#1C1917;--fg:#F5F5F4;--fg-muted:#A8A29E;--fg-soft:#6B6560;
  --border:#292524;--border-strong:#3A3532;--accent:#D8A7B4;--accent-lt:#2A1C20;--ok:#7BC29A;--danger:#F08A7E;--on-fg:#0C0A09;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(110px + env(safe-area-inset-bottom,0px))}

/* Capa */
.capa{position:relative;margin:0 -20px;aspect-ratio:16/11;max-height:420px;background:var(--bg-subtle) center/cover no-repeat;overflow:hidden}
.capa::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(12,10,9,.55))}
.capa.vazia{aspect-ratio:auto;height:96px}
.capa.vazia::after{display:none}
.perfil{position:relative;margin-top:-34px;z-index:1;padding:0 0 4px}
.capa.vazia+.perfil{margin-top:0}
.marca{width:64px;height:64px;border-radius:18px;background:var(--fg);display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.marca span{width:16px;height:16px;border-radius:50%;background:var(--accent)}
h1{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:12px;line-height:1.15}
.bio{color:var(--fg-muted);font-size:15px;line-height:1.5;margin-top:6px;white-space:pre-line}
.acoes{display:flex;gap:8px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid transparent;font-size:15px;font-weight:500;text-decoration:none;transition:opacity .15s,transform .1s,background .15s;width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--fg);color:var(--on-fg)}
.btn-ghost{background:var(--bg-card);border-color:var(--border);color:var(--fg)}
.acoes .btn{width:auto;flex:1}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

h2{font-size:13px;font-weight:500;color:var(--fg-muted);margin:34px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 b{font-size:20px;font-weight:600;color:var(--fg);letter-spacing:-.02em}

/* Book */
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 12px;padding:0 20px}
.pills::-webkit-scrollbar{display:none}
.pill{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--bg-card);font-size:13px;font-weight:500;color:var(--fg-muted);white-space:nowrap}
.pill.on{background:var(--fg);border-color:var(--fg);color:var(--on-fg)}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:14px;overflow:hidden}
.book button{aspect-ratio:1;border:none;padding:0;background:var(--bg-subtle) center/cover no-repeat}
.book button:first-child{grid-column:span 2;grid-row:span 2}
.mais{font-size:13px;color:var(--fg-muted);text-align:center;margin-top:10px}
.mais button{background:none;border:none;color:var(--fg);text-decoration:underline;font-size:13px}

/* Avaliações */
.avals{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x mandatory;scroll-padding:0 20px}
.avals::-webkit-scrollbar{display:none}
.aval{flex:0 0 78%;scroll-snap-align:start;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.estrelas{color:#C08A2E;letter-spacing:2px;font-size:13px}
.aval p{font-size:14.5px;line-height:1.5;margin:8px 0 10px}
.aval small{color:var(--fg-muted);font-size:13px}

/* Agendamento */
.passo{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.passo-tit{display:flex;align-items:center;gap:10px;font-weight:500}
.num{width:24px;height:24px;border-radius:50%;background:var(--bg-subtle);color:var(--fg-muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.passo.feito .num{background:var(--fg);color:var(--on-fg)}
.passo-val{margin-left:auto;font-size:14px;color:var(--fg-muted);text-align:right}
.passo-corpo{margin-top:14px}
.tipo{font-size:12.5px;color:var(--fg-soft);margin:14px 0 6px}
.tipo:first-child{margin-top:0}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--border);padding:12px 2px}
.tipo+.svc{border-top:none}
.svc .n{flex:1;font-weight:500}
.svc .d{font-size:13px;color:var(--fg-muted);font-weight:400}
.svc .p{font-weight:500;font-variant-numeric:tabular-nums}
.svc.on .n::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.dias{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.dias::-webkit-scrollbar{display:none}
.dia{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;padding:9px 0;border-radius:12px;border:1px solid var(--border);background:var(--bg-card)}
.dia small{font-size:11px;color:var(--fg-muted)}
.dia b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.dia em{font-style:normal;font-size:10.5px;color:var(--fg-soft)}
.dia.on{background:var(--fg);border-color:var(--fg)}
.dia.on small,.dia.on b,.dia.on em{color:var(--on-fg)}
.dia:disabled{opacity:.35}
.mes{font-size:13px;color:var(--fg-muted);margin-bottom:10px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{padding:11px 4px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.slot.on{background:var(--fg);border-color:var(--fg);color:var(--on-fg)}
.vazio{grid-column:1/-1;text-align:center;color:var(--fg-muted);font-size:14px;padding:14px 0}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.campo label{font-size:12.5px;font-weight:500;color:var(--fg-muted)}
.campo input,.campo textarea{padding:12px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);font-size:16px;outline:none;width:100%}
.campo input:focus,.campo textarea:focus{border-color:var(--fg)}
.erro{color:var(--danger);font-size:14px;margin-top:10px;line-height:1.45}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:12px 20px max(12px,env(safe-area-inset-bottom,0px))}
.barra-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.barra-txt{flex:1;min-width:0;font-size:13.5px;color:var(--fg-muted);line-height:1.35}
.barra-txt b{display:block;color:var(--fg);font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .btn{width:auto;padding:12px 22px}

/* Sucesso */
.ok{text-align:center;padding:56px 0 20px}
.ok-ic{width:64px;height:64px;border-radius:50%;background:var(--fg);color:var(--on-fg);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.ok-ic svg{width:28px;height:28px;stroke-width:2.2}
.ok h1{margin-top:0}
.resumo{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:6px 16px;margin:22px 0 14px;text-align:left}
.resumo div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14.5px}
.resumo div:last-child{border-bottom:none}
.resumo span{color:var(--fg-muted)}
.col{display:flex;flex-direction:column;gap:8px}

/* Foto ampliada */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:12px}
.lightbox img{max-width:100%;max-height:82vh;border-radius:10px}
.lightbox p{color:#E7E5E4;font-size:14px;text-align:center}
.lightbox button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:22px}

.carregando{display:flex;align-items:center;justify-content:center;min-height:70vh;color:var(--fg-muted)}
.rodape{text-align:center;font-size:12px;color:var(--fg-soft);margin-top:34px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="carregando">Carregando…</div></div>
<div class="barra" id="barra" hidden><div class="barra-in"><div class="barra-txt" id="barraTxt"></div><button class="btn btn-primary" id="barraBtn"></button></div></div>
<div class="lightbox" id="lightbox" hidden onclick="if(event.target===this)fecharFoto()"><button onclick="fecharFoto()" aria-label="Fechar">×</button><img id="lbImg" alt=""><p id="lbTxt"></p></div>

<script>
// Página pública: lê tudo por funções seguras do banco (agenda_publica,
// horarios_ocupados, agendar_online) — nunca enxerga dados de outras clientes.
const SUPABASE_URL='https://rsrpfwtrkpclscpccaok.supabase.co';
const SUPABASE_KEY='sb_publishable_0FRlkE_cdq_RKIpX6pSjGA_boyTYEX0';
const SLUG=(new URLSearchParams(location.search).get('u')||'').toLowerCase();
const CATS={gel:'Unhas em gel',acrilico:'Acrílico',esmaltacao:'Esmaltação',nailart:'Nail art',podologia:'Podologia',tratamentos:'Tratamentos'};
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

let A=null, escolha={svc:null,dia:null,hora:null}, filtroFoto='todos', verTodas=false;
const ocupadosCache={};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
const hhmm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const reais=v=>'R$ '+Number(v).toFixed(2).replace('.',',').replace(',00','');
const foto=c=>`${SUPABASE_URL}/storage/v1/object/public/portfolio/${c.split('/').map(encodeURIComponent).join('/')}`;
const telLink=t=>t?`https://wa.me/${String(t).replace(/\D/g,'')}`:null;

async function rpc(fn,args){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e=new Error(j?.message||'erro');e.codigo=j?.message;throw e}
  return j;
}

async function iniciar(){
  if(!SLUG){indisponivel();return}
  try{A=await rpc('agenda_publica',{p_slug:SLUG})}catch(e){A=null}
  if(!A){indisponivel();return}
  document.title=`${A.nome} · Agende seu horário`;
  render();
}
function indisponivel(){
  document.getElementById('app').innerHTML='<div class="carregando" style="flex-direction:column;gap:8px;text-align:center"><b style="color:var(--fg);font-size:18px;font-weight:600">Agenda indisponível</b><span>Este link de agendamento não está ativo no momento.</span></div>';
}

// ── Dias e horários livres (calculados aqui; o banco confere de novo ao agendar)
function horarioDia(d){return A.horarios.find(h=>h.dia===d.getDay())}
function diasDisponiveis(){
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const out=[];
  for(let i=0;i<=A.dias_frente;i++){const d=new Date(hoje);d.setDate(d.getDate()+i);out.push(d)}
  return out;
}
async function slotsDoDia(d){
  const h=horarioDia(d);if(!h||!h.abre)return [];
  const k=ymd(d);
  if(!ocupadosCache[k]) ocupadosCache[k]=(await rpc('horarios_ocupados',{p_slug:SLUG,p_dia:k})).map(([i,f])=>[new Date(i),new Date(f)]);
  const ocup=ocupadosCache[k];
  const dur=escolha.svc.duracao_min+escolha.svc.intervalo_min;
  const minimo=Date.now()+A.antecedencia_min*6e4, limite=Date.now()+A.dias_frente*864e5;
  const out=[];
  for(let m=toMin(h.abre);m+dur<=toMin(h.fecha);m+=30){
    if(h.almoco_inicio&&m<toMin(h.almoco_fim)&&m+dur>toMin(h.almoco_inicio)) continue;
    const ini=new Date(`${k}T${hhmm(m)}:00-03:00`), fim=new Date(ini.getTime()+dur*6e4);
    if(ini.getTime()<minimo||ini.getTime()>limite) continue;
    if(ocup.some(([oi,of])=>ini<of&&fim>oi)) continue;
    out.push(hhmm(m));
  }
  return out;
}

// ── Render ──
function render(){
  const fotos=A.fotos.filter(f=>filtroFoto==='todos'||f.categoria===filtroFoto);
  const catsComFoto=[...new Set(A.fotos.map(f=>f.categoria))];
  const wa=telLink(A.whatsapp);
  const tipos=[['esmalteria','Esmalteria'],['podologia','Podologia']].filter(([t])=>A.servicos.some(s=>s.tipo===t));
  document.getElementById('app').innerHTML=`
    <div class="capa${A.foto_capa?'':' vazia'}" ${A.foto_capa?`style="background-image:url('${foto(A.foto_capa)}')"`:''}></div>
    <div class="perfil">
      <div class="marca"><span></span></div>
      <h1>${esc(A.nome)}</h1>
      ${A.bio?`<p class="bio">${esc(A.bio)}</p>`:''}
      <div class="acoes">
        <a class="btn btn-primary" href="#agendar">Agendar horário</a>
        ${wa?`<a class="btn btn-ghost" href="${wa}" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg>WhatsApp</a>`:''}
      </div>
    </div>

    ${A.fotos.length?`
    <h2><b>Trabalhos</b><span>${A.fotos.length} foto${A.fotos.length>1?'s':''}</span></h2>
    ${catsComFoto.length>1?`<div class="pills"><button class="pill ${filtroFoto==='todos'?'on':''}" onclick="filtrar('todos')">Todos</button>${catsComFoto.map(c=>`<button class="pill ${filtroFoto===c?'on':''}" onclick="filtrar('${c}')">${CATS[c]||c}</button>`).join('')}</div>`:''}
    <div class="book">${fotos.slice(0,verTodas?60:9).map((f,i)=>`<button style="background-image:url('${foto(f.caminho)}')" aria-label="${esc(f.legenda||CATS[f.categoria]||'Foto')}" onclick="abrirFoto(${A.fotos.indexOf(f)})"></button>`).join('')}</div>
    ${!verTodas&&fotos.length>9?`<div class="mais"><button onclick="verTodas=true;render()">Ver todas as ${fotos.length} fotos</button></div>`:''}`:''}

    ${A.avaliacoes.length?`
    <h2><b>O que dizem</b></h2>
    <div class="avals">${A.avaliacoes.map(a=>`<div class="aval"><div class="estrelas">${'★'.repeat(a.nota)}</div>${a.comentario?`<p>“${esc(a.comentario)}”</p>`:''}<small>${esc(a.nome)}</small></div>`).join('')}</div>`:''}

    <h2 id="agendar"><b>Agendar</b><span>até ${A.dias_frente} dias à frente</span></h2>
    <div class="passo ${escolha.svc?'feito':''}">
      <div class="passo-tit"><span class="num">1</span>Serviço${escolha.svc?`<span class="passo-val">${esc(escolha.svc.nome)}</span>`:''}</div>
      <div class="passo-corpo">${tipos.map(([t,n])=>`<div class="tipo">${n}</div>`+A.servicos.filter(s=>s.tipo===t).map(s=>`
        <button class="svc ${escolha.svc?.id===s.id?'on':''}" onclick="escolherSvc('${s.id}')"><span class="n">${esc(s.nome)}<br><span class="d">${s.duracao_min} min</span></span><span class="p">${reais(s.preco)}</span></button>`).join('')).join('')}</div>
    </div>
    <div class="passo ${escolha.dia?'feito':''}" id="passoDia" ${escolha.svc?'':'hidden'}></div>
    <div class="passo ${escolha.hora?'feito':''}" id="passoHora" ${escolha.dia?'':'hidden'}></div>
    <div class="passo" id="passoDados" ${escolha.hora?'':'hidden'}>
      <div class="passo-tit"><span class="num">4</span>Seus dados</div>
      <div class="passo-corpo">
        <div class="campo"><label for="nome">Nome</label><input id="nome" autocomplete="name" placeholder="Seu nome" maxlength="80"></div>
        <div class="campo"><label for="tel">WhatsApp</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" oninput="mascara(this)"></div>
        <div class="campo"><label for="obs">Observação (opcional)</label><textarea id="obs" rows="2" maxlength="300" placeholder="Alguma preferência ou alergia?"></textarea></div>
        <div class="erro" id="erro" hidden></div>
      </div>
    </div>
    <p class="rodape">Agendamento online · seus dados só são usados para o atendimento</p>`;
  restaurarDados();
  if(escolha.svc) renderDias();
  if(escolha.dia) renderHoras();
  atualizarBarra();
}
let dadosTmp={};
function guardarDados(){['nome','tel','obs'].forEach(id=>{const e=document.getElementById(id);if(e)dadosTmp[id]=e.value})}
function restaurarDados(){['nome','tel','obs'].forEach(id=>{const e=document.getElementById(id);if(e&&dadosTmp[id])e.value=dadosTmp[id]})}
function filtrar(c){guardarDados();filtroFoto=c;verTodas=false;render()}
function abrirFoto(i){const f=A.fotos[i];document.getElementById('lbImg').src=foto(f.caminho);document.getElementById('lbTxt').textContent=f.legenda||CATS[f.categoria]||'';document.getElementById('lightbox').hidden=false}
function fecharFoto(){document.getElementById('lightbox').hidden=true}

function escolherSvc(id){
  guardarDados();
  escolha={svc:A.servicos.find(s=>s.id===id),dia:escolha.dia,hora:null};
  render();
  document.getElementById('passoDia').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderDias(){
  const el=document.getElementById('passoDia');
  const dias=diasDisponiveis();
  const d0=escolha.dia||dias.find(d=>horarioDia(d)?.abre);
  el.innerHTML=`<div class="passo-tit"><span class="num">2</span>Dia${escolha.dia?`<span class="passo-val">${DIAS[escolha.dia.getDay()]}, ${escolha.dia.getDate()} de ${MESES[escolha.dia.getMonth()]}</span>`:''}</div>
    <div class="passo-corpo"><div class="mes" id="mesTxt">${MESES[(d0||new Date()).getMonth()].replace(/^./,c=>c.toUpperCase())}</div>
    <div class="dias" id="dias" onscroll="mesVisivel()">${dias.map((d,i)=>{const fechado=!horarioDia(d)?.abre;return `<button class="dia ${escolha.dia&&ymd(escolha.dia)===ymd(d)?'on':''}" data-mes="${d.getMonth()}" ${fechado?'disabled':''} onclick="escolherDia('${ymd(d)}')"><small>${i===0?'Hoje':DIAS[d.getDay()]}</small><b>${d.getDate()}</b><em>${fechado?'fechado':''}</em></button>`}).join('')}</div></div>`;
  const on=el.querySelector('.dia.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
function mesVisivel(){
  const box=document.getElementById('dias'), b=[...box.children].find(x=>x.offsetLeft+x.offsetWidth>box.scrollLeft+20);
  if(b) document.getElementById('mesTxt').textContent=MESES[+b.dataset.mes].replace(/^./,c=>c.toUpperCase());
}
function escolherDia(k){
  guardarDados();
  escolha.dia=new Date(k+'T12:00:00');escolha.hora=null;
  render();
  document.getElementById('passoHora').scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function renderHoras(){
  const el=document.getElementById('passoHora');
  el.innerHTML=`<div class="passo-tit"><span class="num">3</span>Horário${escolha.hora?`<span class="passo-val">${escolha.hora}</span>`:''}</div><div class="passo-corpo"><div class="slots"><div class="vazio">Buscando horários…</div></div></div>`;
  let s=[];
  try{s=await slotsDoDia(escolha.dia)}catch(e){}
  el.querySelector('.slots').innerHTML=s.length?s.map(h=>`<button class="slot ${escolha.hora===h?'on':''}" onclick="escolherHora('${h}')">${h}</button>`).join('')
    :'<div class="vazio">Sem horários livres neste dia. Escolha outro dia.</div>';
}
function escolherHora(h){
  guardarDados();
  escolha.hora=h;
  render();
  document.getElementById('passoDados').scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>document.getElementById('nome').focus({preventScroll:true}),400);
}
function mascara(i){
  let d=i.value.replace(/\D/g,'').slice(0,11);
  i.value=d.length>6?`(${d.slice(0,2)}) ${d.slice(2,d.length-4)}-${d.slice(-4)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d;
}
function atualizarBarra(){
  const b=document.getElementById('barra'), t=document.getElementById('barraTxt'), btn=document.getElementById('barraBtn');
  b.hidden=false;
  if(!escolha.svc){t.innerHTML='<b>Escolha um serviço</b>para ver os horários';btn.textContent='Agendar';btn.onclick=()=>document.getElementById('agendar').scrollIntoView({behavior:'smooth'});return}
  const d=escolha.dia?`${DIAS[escolha.dia.getDay()]} ${escolha.dia.getDate()}/${pad(escolha.dia.getMonth()+1)}`:'';
  t.innerHTML=`<b>${esc(escolha.svc.nome)}</b>${d}${escolha.hora?' às '+escolha.hora:''}${d?' · ':''}${reais(escolha.svc.preco)}`;
  if(!escolha.dia){btn.textContent='Escolher dia';btn.onclick=()=>document.getElementById('passoDia').scrollIntoView({behavior:'smooth'})}
  else if(!escolha.hora){btn.textContent='Escolher horário';btn.onclick=()=>document.getElementById('passoHora').scrollIntoView({behavior:'smooth'})}
  else{btn.textContent='Confirmar';btn.onclick=confirmar}
}

const ERROS={
  ocupado:'Esse horário acabou de ser reservado. Escolha outro, por favor.',
  fora_do_horario:'Esse horário está fora do expediente. Escolha outro.',
  cedo_demais:'Esse horário está muito em cima da hora. Escolha um mais tarde.',
  longe_demais:'Essa data ainda não está aberta para agendamento.',
  nome_invalido:'Digite seu nome.',
  telefone_invalido:'Confira o número do WhatsApp com DDD.',
  limite:'Você já tem horários marcados por aqui. Fale com a gente pelo WhatsApp para marcar mais.',
  agenda_indisponivel:'A agenda online está fechada no momento.',
  servico_invalido:'Esse serviço não está mais disponível.',
};
async function confirmar(){
  const nome=document.getElementById('nome').value.trim(), tel=document.getElementById('tel').value, obs=document.getElementById('obs').value.trim();
  const erro=document.getElementById('erro');
  const mostrar=m=>{erro.textContent=m;erro.hidden=false;erro.scrollIntoView({behavior:'smooth',block:'center'})};
  if(nome.length<2) return mostrar(ERROS.nome_invalido);
  if(tel.replace(/\D/g,'').length<10) return mostrar(ERROS.telefone_invalido);
  const btn=document.getElementById('barraBtn');btn.disabled=true;btn.textContent='Agendando…';
  try{
    await rpc('agendar_online',{p_slug:SLUG,p_servico:escolha.svc.id,p_inicio:`${ymd(escolha.dia)}T${escolha.hora}:00-03:00`,p_nome:nome,p_telefone:tel,p_obs:obs||null});
    sucesso(nome);
  }catch(e){
    btn.disabled=false;atualizarBarra();
    mostrar(ERROS[e.codigo]||'Não deu certo agora. Tente de novo em instantes.');
    if(e.codigo==='ocupado'){delete ocupadosCache[ymd(escolha.dia)];escolha.hora=null;guardarDados();render()}
  }
}
function sucesso(nome){
  document.getElementById('barra').hidden=true;
  const ini=new Date(`${ymd(escolha.dia)}T${escolha.hora}:00-03:00`), fim=new Date(ini.getTime()+escolha.svc.duracao_min*6e4);
  const g=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const cal=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(escolha.svc.nome+' — '+A.nome)}&dates=${g(ini)}/${g(fim)}&details=${encodeURIComponent('Agendado pelo link')}`;
  const wa=A.whatsapp?`https://wa.me/${A.whatsapp}?text=${encodeURIComponent(`Oi! Acabei de agendar ${escolha.svc.nome} para ${DIAS[escolha.dia.getDay()]}, ${escolha.dia.getDate()}/${pad(escolha.dia.getMonth()+1)} às ${escolha.hora}. Meu nome é ${nome}.`)}`:null;
  document.getElementById('app').innerHTML=`
    <div class="ok">
      <div class="ok-ic"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>Horário reservado</h1>
      <p class="bio">Obrigada, ${esc(nome.split(' ')[0])}! Você vai receber a confirmação pelo WhatsApp.</p>
    </div>
    <div class="resumo">
      <div><span>Serviço</span><b>${esc(escolha.svc.nome)}</b></div>
      <div><span>Dia</span><b>${DIAS[escolha.dia.getDay()]}, ${escolha.dia.getDate()} de ${MESES[escolha.dia.getMonth()]}</b></div>
      <div><span>Horário</span><b>${escolha.hora}</b></div>
      <div><span>Valor</span><b>${reais(escolha.svc.preco)}</b></div>
    </div>
    <div class="col">
      <a class="btn btn-ghost" href="${cal}" target="_blank" rel="noopener">Salvar no Google Agenda</a>
      ${wa?`<a class="btn btn-ghost" href="${wa}" target="_blank" rel="noopener">Avisar pelo WhatsApp</a>`:''}
      <button class="btn btn-ghost" onclick="location.reload()">Agendar outro horário</button>
    </div>`;
  window.scrollTo({top:0});
}
iniciar();
</script>
